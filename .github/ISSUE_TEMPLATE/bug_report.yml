name: Bug Report
description: Report a bug or unexpected behavior in Umbra SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK Version
      description: Which version of `@umbra-escrow-and-dispute-window/umbra-sdk` are you using?
      placeholder: "0.1.0-rc.1"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or steps that reproduce the issue.
      placeholder: |
        1. Instantiate Umbra(...)
        2. Call ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Runtime Environment
      description: Node.js version, browser, OS, and Stellar network (Testnet / Mainnet).
      placeholder: "Node 22.x, Windows 11, Soroban Testnet"
